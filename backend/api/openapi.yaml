      description: The Main view cannot be removed (MAIN_IMAGE_REQUIRED), only replaced.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The color without that image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehicleColor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /catalog/selectable:
    get:
      tags: [Catalog]
      operationId: listSelectableCatalog
      summary: What the sale form can offer
      description: |
        Active models that have at least one selectable version and one selectable color, with those versions
        (ordered by price) and colors (with their Main view image).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The selectable catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SelectableModel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: ef_employee_refresh
  parameters:
    VehicleModelId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleVersionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VehicleColorId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CustomerId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    EmployeeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Must be EndosoFlow. A form on another site cannot send it.
      schema: { type: string, enum: [EndosoFlow] }
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The employee's role does not allow this action.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: The record does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: The request conflicts with the current state (version, uniqueness or a business rule).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unprocessable:
      description: The data breaks a validation or business rule. Field problems are listed in error.fields.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, error] }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: Stable English code. }
            message:
              { type: string, description: Spanish text that is safe to show. }
            fields:
              type: array
              items: { $ref: "#/components/schemas/FieldError" }
            requestId: { type: string }
    Accepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted] }
    Role:
      type: string
      enum: [system_admin, sales_manager, sales_advisor]
    DocumentType:
      type: string
      enum: [DNI, CE, PAS]
    LoginRequest:
      type: object
      required: [documentType, documentNumber, password]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        password: { type: string }
        rememberMe: { type: boolean, default: false }
    TokenPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 10, maxLength: 128 }
    ForgotPasswordRequest:
      type: object
      required: [documentType, documentNumber]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 10, maxLength: 128 }
    Profile:
      type: object
      required:
        [
          id,
          documentType,
          documentNumber,
          firstName,
          lastName,
          businessEmail,
          role,
        ]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        businessEmail: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    SessionResponse:
      type: object
      required: [accessToken, expiresAt, employee]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        employee: { $ref: "#/components/schemas/Profile" }
    Employee:
      type: object
      required:
        [
          id,
          documentType,
          documentNumber,
          firstName,
          lastName,
          nameSource,
          nationality,
          gender,
          birthdate,
          hireDate,
          businessPhone,
          businessEmail,
          role,
          isActive,
          version,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        nameSource: { type: string, enum: [manual, looked_up] }
        nationality: { type: string }
        gender: { type: string, enum: [M, F] }
        birthdate: { type: string, format: date }
        hireDate: { type: string, format: date }
        personalPhone: { type: string, nullable: true }
        personalEmail: { type: string, nullable: true }
        businessPhone: { type: string }
        businessEmail: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        isActive: { type: boolean }
        activatedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Null until the person sets a password.,
          }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmployeeList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Employee" }
        page: { type: integer }
        pageSize: { type: integer }
