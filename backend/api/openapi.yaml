            application/json:
              schema: { $ref: "#/components/schemas/VehicleModel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Catalog]
      operationId: updateVehicleModel
      summary: Edit a model (Admin, Manager)
      description: Only the fields sent change. version is required. Existing sale snapshots never change.
      security:
        - bearerAuth: []
