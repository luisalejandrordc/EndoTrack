  /vehicle-colors/{id}/images/{viewpoint}:
    parameters:
      - $ref: "#/components/parameters/VehicleColorId"
      - name: viewpoint
        in: path
        required: true
        schema: { $ref: "#/components/schemas/Viewpoint" }
    put:
      tags: [Catalog]
      operationId: putVehicleColorImage
      summary: Add or replace one image of a color (Admin, Manager)
      description: |
        Sent as multipart/form-data with one file part called file. A color has at most one image per viewpoint;
        replacing one uploads the new file, updates the record and deletes the old file after the commit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ImageUploadMultipart" }
            encoding:
              file: { contentType: "image/jpeg, image/png, image/webp" }
