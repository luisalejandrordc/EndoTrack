        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Catalog]
      operationId: deleteVehicleModel
      summary: Permanently delete a model that no sale uses (Admin)
      description: Exceptional. Removes its versions, colors and images. A model any sale references must be archived instead.
      security:
        - bearerAuth: []
      parameters:
        - name: reason
          in: query
          required: true
          description: Why the entry is being deleted. It is kept in the audit trail.
          schema: { type: string, minLength: 1 }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /vehicle-models/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/VehicleModelId"
    post:
      tags: [Catalog]
      operationId: archiveVehicleModel
      summary: Archive a model (Admin, Manager)
      description: An archived model leaves the sale form and Advisor lists. Existing sales are unaffected.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The archived model.
